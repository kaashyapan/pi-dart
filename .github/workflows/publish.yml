name: Publish Package to npmjs

# Publishes on v* tags (or manually). The verify job gates publishing: the
# package is pure TypeScript source that pi loads directly (no build step),
# so "verified" means: typechecks clean, the full test suite passes against
# a real Dart SDK, and the tarball actually contains every module
# that package.json's pi.extensions entry point needs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The test suite is integration-grade: it executes the registered
      # tool handlers against real `dart` runs (analyze/test/fix/build_runner)
      # on the fixture packages, so the Dart SDK must be on PATH — which also
      # dogfoods the extension's own runtime dependency.
      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Fail the release if a module is missing from package.json "files" —
      # e.g. after a refactor splits moonbit.ts into a new file.
      - name: Verify package contents
        run: |
          bun pm pack --dry-run | tee pack-output.log
          for f in \
            extensions/dart.ts \
            extensions/dartexec.ts \
            extensions/doctor.ts \
            tsconfig.json; do
            grep -q "packed.*${f}$" pack-output.log || {
              echo "MISSING from package tarball: ${f}"; exit 1; }
          done
          # the extension entry point referenced by pi.extensions must ship
          grep -q "packed.*extensions/dart.ts$" pack-output.log || {
            echo "Entry point extensions/dart.ts is not packaged"; exit 1; }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for provenance
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
